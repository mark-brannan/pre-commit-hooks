name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: shell syntax and shellcheck
        run: |
          for f in hooks/*.sh; do bash -n "$f"; done
          shellcheck -x hooks/*.sh
      - name: unit tests
        run: for t in tests/test_*.py; do python3 "$t" -q || exit 1; done
      - name: hooks run against this repo, repo-wide
        run: |
          hooks/lint_repo_hygiene.py --all
          hooks/check_encoding_health.py --repo
      - name: manifest loads in pre-commit
        run: |
          pip install pre-commit
          pre-commit try-repo . repo-hygiene --all-files
